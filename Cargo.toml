[package]
name = "vn-launcher"
version = "2.4.0"
edition = "2021"
authors = ["VN Launcher Open Source Community"]
description = "VN Launcher - Open-source, ultra-optimized Minecraft: Java Edition Launcher written in Rust with 1024-chunk LOD preset & 1-click Modrinth mod manager"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
md-5 = "0.10"
rfd = "0.15"
rayon = "1.10"
dirs = "5.0"
image = { version = "0.25", default-features = false, features = ["png"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
