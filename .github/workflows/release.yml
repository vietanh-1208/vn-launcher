name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: VN-Launcher-Windows-x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: VN-Launcher-Linux-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: VN-Launcher-macOS-AppleSilicon.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: VN-Launcher-macOS-Intel.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: copy target\${{ matrix.target }}\release\vn-launcher.exe ${{ matrix.artifact }}

      - name: Package Unix
        if: matrix.os != 'windows-latest'
        run: tar -czf ${{ matrix.artifact }} -C target/${{ matrix.target }}/release vn-launcher

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
